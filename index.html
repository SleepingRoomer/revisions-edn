<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Révisions EDN</title>
<meta name="description" content="Plateforme personnelle de révision EDN : fiches, QCM à J1, J7, J30, carnet d'erreurs, suivi par objectif LiSA.">
<meta name="theme-color" content="#213a73">
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fa; --line:#d5dbe4; --line-strong:#b9c2cf;
  --ink:#1c1f24; --ink-2:#4b5260; --ink-3:#7d8492;
  --bar:#213a73; --bar-ink:#ffffff; --accent:#213a73;
  --sky:#d4e5f7; --sky-ink:#1c1f24;
  --salmon:#ec9ba1; --salmon-hover:#e5868d; --salmon-ink:#ffffff;
  --red:#d9534f;
  --ok:#23804f; --ok-soft:#e1f2e8; --ok-bar:#2f8f5b;
  --bad:#c23b3b; --bad-soft:#fbe3e3; --bad-bar:#c94a4a;
  --mid:#a76b00; --mid-soft:#fbefd6;
  --shadow:0 1px 3px rgba(18,32,64,.12);
  --font:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f141d; --surface:#171e2b; --surface-2:#1d2636; --line:#2b3547; --line-strong:#3d4a60;
    --ink:#e7eaf0; --ink-2:#b5bccb; --ink-3:#8790a2;
    --bar:#2c4b8e; --bar-ink:#ffffff; --accent:#9dbcf0;
    --sky:#24344f; --sky-ink:#e7eaf0;
    --salmon:#c96f77; --salmon-hover:#d47f86; --salmon-ink:#ffffff;
    --red:#f08a86;
    --ok:#6cc896; --ok-soft:#163324; --ok-bar:#2d7a50;
    --bad:#f0928c; --bad-soft:#3b1d1d; --bad-bar:#a94545;
    --mid:#e8b65c; --mid-soft:#352912;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141d; --surface:#171e2b; --surface-2:#1d2636; --line:#2b3547; --line-strong:#3d4a60;
  --ink:#e7eaf0; --ink-2:#b5bccb; --ink-3:#8790a2;
  --bar:#2c4b8e; --bar-ink:#ffffff; --accent:#9dbcf0;
  --sky:#24344f; --sky-ink:#e7eaf0;
  --salmon:#c96f77; --salmon-hover:#d47f86; --salmon-ink:#ffffff;
  --red:#f08a86;
  --ok:#6cc896; --ok-soft:#163324; --ok-bar:#2d7a50;
  --bad:#f0928c; --bad-soft:#3b1d1d; --bad-bar:#a94545;
  --mid:#e8b65c; --mid-soft:#352912;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
/* ---------- shell header ---------- */
header.top{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand svg{flex:none}
.who{display:flex;align-items:center;gap:8px;padding-left:18px;border-left:1px solid var(--line);font-size:14px;line-height:1.25;color:var(--ink)}
.who svg{flex:none;color:var(--bar)}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:9px 12px;color:var(--ink-2);text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap;border-radius:3px}
nav.tabs a:hover{background:var(--surface-2)}
nav.tabs a[aria-current="page"]{background:var(--bar);color:var(--bar-ink)}
main{padding:22px 0 64px}
.bartitle{background:var(--bar);color:var(--bar-ink);padding:16px 20px;font-size:17px;font-weight:400;border-radius:2px}
.bartitle b{font-weight:700}
.lead{color:var(--ink-2);font-size:14px;margin:10px 2px 0}
h2{font-size:16px;font-weight:700;margin:28px 0 10px;color:var(--ink)}
h3{font-size:15px;font-weight:700;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow)}
.pad{padding:16px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.wrapok{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:9px 16px;border-radius:3px;cursor:pointer;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.navy{background:var(--bar);border-color:var(--bar);color:var(--bar-ink)}
.btn.navy:hover{filter:brightness(1.12)}
.btn.salmon{background:var(--salmon);border-color:var(--salmon);color:var(--salmon-ink)}
.btn.salmon:hover{background:var(--salmon-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:13px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.A{background:var(--bar);color:var(--bar-ink)}
.tag.B{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:1px 7px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.mid{background:var(--mid-soft);color:var(--mid)}
.tag.hl{background:var(--surface-2);color:var(--ink-2);font-weight:400}
.itemnum{font-weight:700;font-size:14px;min-width:54px;text-align:center;padding:7px 8px;border-radius:3px;background:var(--sky);color:var(--sky-ink);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{padding:14px 16px}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.1;color:var(--accent)}
.kpi span{font-size:13px;color:var(--ink-3)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:99px}
.empty{padding:20px;text-align:center;color:var(--ink-3);font-size:14px}
.notice{padding:14px 16px;border-radius:3px;background:var(--sky);color:var(--sky-ink);font-size:14px}
table.grid{width:100%;border-collapse:collapse;font-size:14px}
table.grid th,table.grid td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
table.grid th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700}
table.grid tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
/* checkbox look (EDN-like square) */
.ck{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.5px solid #6c7a90;border-radius:3px;background:#fff;display:inline-grid;place-items:center;margin:0;flex:none;cursor:pointer}
.ck:checked{border-color:#fff;background:#fff}
.ck:checked::after{content:"";width:5px;height:10px;border:solid var(--bar);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.ck:disabled{cursor:default}
.ck.on-light:checked{border-color:var(--bar);background:var(--bar)}
.ck.on-light:checked::after{border-color:#fff}
/* relecture / programme */
.prog-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.prog-row:first-child{border-top:0}
.prog-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.relec{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:3px;background:var(--sky);color:var(--sky-ink);font-weight:700;font-size:13px;cursor:pointer;user-select:none;white-space:nowrap;border:1px solid transparent}
.relec.done{background:var(--bar);color:var(--bar-ink)}
.relec.late{border-color:var(--red)}
.relec small{font-weight:400;opacity:.85}
.late-t{color:var(--red);font-weight:700}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.mode{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line-strong);border-radius:3px;cursor:pointer;background:var(--surface)}
.mode input{margin-top:3px;accent-color:var(--bar)}
.mode.on{border-color:var(--bar);box-shadow:inset 0 0 0 1px var(--bar)}
.mode b{display:block;font-size:14px}
.mode span{font-size:13px;color:var(--ink-3)}
.objline{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 16px;border-top:1px dashed var(--line);font-size:14px}
.objline code{font-size:12px;color:var(--ink-3);font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
details.obj{border-top:1px solid var(--line)}
details.obj:first-child{border-top:0}
details.obj summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
details.obj summary::-webkit-details-marker{display:none}
details.obj summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-left:4px;flex:none}
details.obj[open] summary::after{transform:rotate(225deg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:3px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-2);font-weight:700}
.chip[aria-pressed="true"]{background:var(--bar);color:var(--bar-ink);border-color:var(--bar)}
.daygroup{margin-top:18px}
.daygroup h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin-bottom:8px}
.ev{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.ev:first-child{border-top:0}
.ev>div{min-width:0;overflow-wrap:anywhere}
.ev .t{color:var(--ink-3);font-variant-numeric:tabular-nums}
.k{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--ink-3)}
.k.cours{background:#5b8bd0}.k.conf{background:#8a6fd1}.k.edn,.k.examen{background:var(--red)}.k.quiz{background:var(--mid)}.k.rangA{background:var(--ok)}
.fiche-h{background:var(--sky);color:var(--sky-ink);padding:12px 16px;display:flex;gap:12px;align-items:center;font-weight:700}
.jgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.jcell{border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-size:13px}
.jcell .jt{font-weight:700;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}

/* ---------- contexte / carnet ---------- */
.xctx{margin-top:14px;padding:14px 16px 4px;border-left:4px solid var(--bar);background:var(--surface-2);border-radius:0 3px 3px 0}
.xctx b{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:4px}
.xctx p{margin:0 0 12px;font-size:14.5px;line-height:1.55}
.cbox{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border:1px dashed var(--salmon);border-radius:3px}
.cbox.in{border-style:solid;background:color-mix(in srgb,var(--salmon) 9%,var(--surface))}
.cnote{width:100%;min-height:72px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface);color:var(--ink);resize:vertical;margin-bottom:8px}
.foot{border-top:1px solid var(--line);margin-top:28px;padding:14px 0 28px;color:var(--ink-3);font-size:12.5px}
.foot .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.foot button{font:inherit;font-size:12.5px;background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:2px 0}
.foot button:disabled{opacity:.5;cursor:default}
body.in-exam .foot{display:none}
.setup{max-width:620px;margin:18px auto 0}
.setup label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 4px}
.setup input{width:100%;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface);color:var(--ink)}
.setup .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.setup .r2{grid-template-columns:1fr}}
.setup ol{padding-left:20px;margin:8px 0 0;line-height:1.55;font-size:13.5px;color:var(--ink-2)}
.setup .err{color:var(--bad);font-weight:700;margin-top:10px;font-size:13.5px}
.cdet{margin-top:10px}
.pkeep{margin-left:8px;font:inherit;font-size:12px;font-weight:700;padding:3px 8px;border-radius:3px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;white-space:nowrap}
.pkeep.in{background:var(--salmon);border-color:var(--salmon);color:var(--salmon-ink)}
.pkeep:disabled{opacity:.6;cursor:default}
.cin{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface);color:var(--ink);max-width:100%;min-width:0}
.cform{display:grid;gap:10px}
.cform .r2{display:grid;grid-template-columns:120px 1fr;gap:10px}
@media (max-width:520px){.cform .r2{grid-template-columns:1fr}}
.pstem{font-size:13.5px;color:var(--ink-2);margin:8px 0 10px;line-height:1.5}
.ctypes .chip .n{font-weight:400;margin-left:4px;opacity:.8}
.cdet summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:13.5px}

/* ---------- collèges ---------- */
.st-s4{background:#16294f}.st-s3{background:var(--bar)}.st-s2{background:#5f7fc0}.st-s1{background:#a9c2e6}.st-manual{background:var(--salmon)}.st-todo{background:var(--surface-2)}
:root[data-theme="dark"] .st-s4{background:#8db4ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st-s4{background:#8db4ec}:root:not([data-theme="light"]) .st-s1{background:#3a5482}}
:root[data-theme="dark"] .st-s1{background:#3a5482}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;border:1px solid var(--line)}
.sbar{display:flex;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px;width:100%}
.sbar i{display:block;height:100%}
.edngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:3px}
.ec{aspect-ratio:1;border-radius:2px;font-size:8.5px;line-height:1;display:grid;place-items:center;color:#fff;font-weight:700;overflow:hidden;border:1px solid var(--line)}
.ec.st-s1{color:var(--sky-ink)}.ec.st-todo{border-color:var(--line)}
.colcard{margin-top:12px}
.colcard summary{list-style:none;cursor:pointer;padding:16px;display:block}
.colcard summary::-webkit-details-marker{display:none}
.colnum{font-size:18px;white-space:nowrap}.colnum b{font-size:22px;color:var(--accent)}
.colbody{padding:0 16px 16px;border-top:1px solid var(--line)}
.rub{display:flex;justify-content:space-between;gap:10px;margin:16px 0 8px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-left-width:5px;border-radius:3px;padding:10px 12px;background:var(--surface);min-width:0}
.tile .tt{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.st-b-todo{border-left-color:var(--line-strong)}.st-b-manual{border-left-color:var(--salmon)}.st-b-s1{border-left-color:#a9c2e6}.st-b-s2{border-left-color:#5f7fc0}.st-b-s3{border-left-color:var(--bar)}.st-b-s4{border-left-color:#16294f}
.tg-todo{background:var(--surface-2);color:var(--ink-3);font-weight:400}.tg-manual{background:var(--salmon);color:var(--salmon-ink)}.tg-s1{background:var(--sky);color:var(--sky-ink)}.tg-s2{background:#5f7fc0;color:#fff}.tg-s3{background:var(--bar);color:var(--bar-ink)}.tg-s4{background:#16294f;color:#fff}
.tacts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.colrow{display:block;padding:12px 16px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.colrow:first-child{border-top:0}
.colrow:hover{background:var(--surface-2)}

/* ---------- exam screen ---------- */
body.in-exam header.top{display:none}
body.in-exam main{padding:0}
body.in-exam .wrap{max-width:none;padding:0}
.exam{min-height:100vh;display:flex;flex-direction:column;background:var(--surface)}
.xhead{display:flex;align-items:stretch;min-height:76px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:15;box-shadow:var(--shadow)}
.xbrand{display:flex;align-items:center;gap:10px;padding:0 20px;font-size:20px;font-weight:700;border-right:1px solid var(--line);white-space:nowrap}
.xuser{display:flex;align-items:center;gap:10px;padding:0 20px;font-size:15px;line-height:1.3;white-space:nowrap}
.xuser svg{color:var(--bar)}
.xprog{flex:1;display:flex;align-items:center;justify-content:center;padding:0 12px;min-width:0}
.pill{position:relative;width:220px;max-width:100%;height:40px;border:2.5px solid var(--bar);border-radius:999px;overflow:hidden;background:var(--surface)}
.pill i{position:absolute;inset:0 auto 0 0;background:var(--sky);transition:width .3s}
.pill>span{position:relative;display:flex;align-items:center;justify-content:center;height:100%;font-size:15px;color:var(--ink);white-space:nowrap}
.xtime{display:flex;flex-direction:column;justify-content:center;padding:0 16px;font-size:15px;gap:4px;white-space:nowrap}
.xtime .r{color:var(--red)}
.xtime b{font-weight:400;font-variant-numeric:tabular-nums;margin-left:6px}
.xtime .over b{color:var(--red);font-weight:700}
.xpause{align-self:center;width:44px;height:44px;border-radius:50%;border:0;background:#2a2d33;color:#fff;display:grid;place-items:center;cursor:pointer;margin:0 14px;flex:none}
.xend{border:0;background:var(--salmon);color:var(--salmon-ink);font-size:17px;padding:0 26px;cursor:pointer;line-height:1.35;min-width:170px}
.xend:hover{background:var(--salmon-hover)}
.xbody{flex:1;display:flex;align-items:stretch;position:relative}
.exam.side-left .xbody{flex-direction:row-reverse}
.xmain{flex:1;min-width:0;padding:26px 28px 60px;position:relative}
.xbarq{background:var(--bar);color:var(--bar-ink);padding:22px 26px;font-size:17px}
.xqhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 10px;font-size:17px}
.xqhead .r{font-size:14px;color:var(--ink-2);align-self:center}
.xenonce{font-size:15px;margin:0 0 18px;line-height:1.55}
.xprops{display:flex;flex-direction:column;gap:14px}
.pc{display:block;border:1px solid var(--line-strong);border-radius:3px;box-shadow:0 2px 3px rgba(18,32,64,.15);overflow:hidden;cursor:pointer;background:var(--surface)}
.pc .ph{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--sky);color:var(--sky-ink);padding:9px 12px;font-weight:700;font-size:15px}
.pc .pb{padding:12px 14px;font-size:14px;color:var(--ink);line-height:1.5}
.pc.sel .ph{background:var(--bar);color:var(--bar-ink)}
.pc.lock{cursor:default}
.pc.c-good .ph{background:var(--ok-bar);color:#fff}
.pc.c-miss .ph{background:var(--ok-soft);color:var(--ok)}
.pc.c-miss{border:2px dashed var(--ok-bar)}
.pc.c-wrong .ph{background:var(--bad-bar);color:#fff}
.pc .flag{margin-left:auto;font-size:12px;font-weight:700}
.pc .exp{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink-2)}
.xverdict{margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-radius:3px;background:var(--surface-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
.xactions{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:22px;flex-wrap:wrap}
.xactions .left{margin-right:auto}
.xvalid{background:var(--salmon);color:var(--salmon-ink);border:0;padding:13px 32px;font-size:17px;border-radius:3px;cursor:pointer}

/* ---------- Stockage GitHub ----------
   Les données vivent dans un dépôt GitHub (de préférence privé), un fichier JSON par document :

   par l'API « contents » (un commit par écriture). La clé d'accès reste dans ce navigateur. */
var GH={cfg:null,cache:{},sha:{},q:{},pending:{},subsC:[],subsD:[],loaded:false,syncing:null,lastSync:null,err:null,user:null,timer:null};

      if(!r.ok){var m=(j&&j.message)||("HTTP "+r.status);if(r.status===403&&/not accessible by personal access token/i.test(m))m="la clé GitHub n'a que le droit de lecture : sur github.com, modifie la clé (Settings › Developer settings › Fine-grained tokens) et passe Contents sur « Read and write »";else if(r.status===401)m="clé refusée par GitHub (expirée ou révoquée)";throw ghErr(r.status,m)}return j})},function(){throw ghErr(0,"réseau indisponible")})}

  if(j&&j.errors&&j.errors.length){var m=j.errors[0].message||"erreur GraphQL";throw ghErr(j.errors[0].type==="NOT_FOUND"?404:400,m)}
  var repo=j&&j.data&&j.data.repository;if(!repo)throw ghErr(404,"dépôt introuvable");return repo})}
function ghLoad(){if(GH.syncing)return GH.syncing;GH.syncing=ghQuery(GH.cfg).then(function(repo){
    var cache={},sha={},trunc=[];
    var cols=(repo.object&&repo.object.entries)||[];
    cols.forEach(function(col){if(col.type!=="tree"||!col.object)return;(col.object.entries||[]).forEach(function(f){
      if(f.type!=="blob"||!/\.json$/.test(f.name))return;var p=col.name+"/"+f.name.slice(0,-5);sha[p]=f.oid;
      if(!f.object||f.object.isTruncated||f.object.text==null){trunc.push(p);return}
      try{cache[p]=JSON.parse(f.object.text)}catch(e){}})});
    GH.perm=repo.viewerPermission;
    return Promise.all(trunc.map(function(p){return ghGetFile(p).then(function(r){if(r){cache[p]=r.data;sha[p]=r.sha}})})).then(function(){
      Object.keys(GH.pending).forEach(function(p){if(!GH.pending[p])return;if(p in GH.cache)cache[p]=GH.cache[p];else delete cache[p];if(GH.sha[p])sha[p]=GH.sha[p];else delete sha[p]});
      GH.cache=cache;GH.sha=sha;GH.loaded=true;GH.lastSync=new Date();GH.err=null;GH.syncing=null;ghNotify()})
  }).catch(function(e){GH.syncing=null;GH.err=e;throw e});return GH.syncing}
function ghSnapC(c){var pre=c+"/";var docs=Object.keys(GH.cache).filter(function(k){return k.indexOf(pre)===0&&k.slice(pre.length).indexOf("/")<0}).sort().map(function(k){var d=GH.cache[k];
  return {id:k.slice(pre.length),exists:true,data:function(){return JSON.parse(JSON.stringify(d))},metadata:{}}});
  return {docs:docs,size:docs.length,empty:!docs.length,docChanges:function(){return []},metadata:{}}}
function ghSnapD(p){var d=GH.cache[p];return {id:p.split("/").pop(),exists:d!==undefined,data:function(){return d===undefined?undefined:JSON.parse(JSON.stringify(d))},metadata:{}}}
function ghNotify(){GH.subsC.forEach(function(s){try{s.next(ghSnapC(s.c))}catch(e){console.error(e)}});GH.subsD.forEach(function(s){try{s.next(ghSnapD(s.p))}catch(e){console.error(e)}})}
function ghEnqueue(p,op){GH.pending[p]=(GH.pending[p]||0)+1;var run=(GH.q[p]||Promise.resolve()).then(op);

    var nd=Object.assign({},base,pt);GH.cache[p]=nd;return nd},"Mise à jour "+ghLabel(p))}).then(function(){},ghWriteErr)}

/* ---------- Réglages et pied de page ---------- */
var SETUP={owner:"",repo:"revisions-edn-data",token:"",busy:false,err:""};
(function(){try{var q=new URLSearchParams(location.search).get("depot");if(q&&q.indexOf("/")>0){SETUP.owner=q.split("/")[0];SETUP.repo=q.split("/")[1]}}catch(e){}
  var c=LS.get("edn-gh");if(c){SETUP.owner=c.owner||SETUP.owner;SETUP.repo=c.repo||SETUP.repo}})();
function setupView(){var root=h("div",{},h("div",{class:"bartitle"},h("b",{},"Connexion à tes données")));
  var card=h("div",{class:"card pad setup"});
  card.append(h("p",{style:"margin:0 0 6px"},"Tes données (QCM, résultats, carnet, relectures) sont rangées dans un dépôt GitHub qui t'appartient. Indique-le une fois sur cet appareil, avec une clé d'accès limitée à ce dépôt."));
  var fo=h("input",{type:"text",autocomplete:"username",spellcheck:"false",placeholder:"ton-pseudo",oninput:function(e){SETUP.owner=e.target.value.trim()}});fo.value=SETUP.owner;
  var fr=h("input",{type:"text",spellcheck:"false",placeholder:"revisions-edn-data",oninput:function(e){SETUP.repo=e.target.value.trim()}});fr.value=SETUP.repo;
  var ft=h("input",{type:"password",autocomplete:"off",spellcheck:"false",placeholder:"github_pat_…",oninput:function(e){SETUP.token=e.target.value.trim()}});ft.value=SETUP.token;
  card.append(h("div",{class:"r2"},h("div",{},h("label",{},"Compte GitHub"),fo),h("div",{},h("label",{},"Dépôt de données"),fr)),h("label",{},"Clé d'accès (fine-grained token)"),ft);
  if(SETUP.err)card.append(h("div",{class:"err",role:"alert"},SETUP.err));
  card.append(h("div",{class:"row wrapok",style:"justify-content:flex-end;margin-top:14px"},h("button",{class:"btn salmon",disabled:SETUP.busy,onclick:connect},SETUP.busy?"Connexion…":"Se connecter")));
  card.append(h("details",{class:"cdet",style:"margin-top:16px"},h("summary",{},"Créer la clé d'accès"),
    h("ol",{},h("li",{},"Sur github.com : photo de profil › Settings › Developer settings › Personal access tokens › Fine-grained tokens › Generate new token."),

function connect(){var cfg={owner:SETUP.owner,repo:SETUP.repo,token:SETUP.token};

    h("button",{disabled:!!GH.syncing,onclick:syncNow},"Synchroniser"),h("button",{onclick:disconnect},"Changer de dépôt"))}

/* ---------- Branchement des données ---------- */
function failSub(name){return function(){S.got[name]=true;render()}}
